# GitHub Pages deployment workflow
# Deploys the documentation site from docs/ directory + official_document/ markdown files
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'official_document/**'
      - '.github/workflows/pages.yml'
  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          # Create build output directory
          mkdir -p _site

          # Copy the static site files
          cp -r docs/* _site/

          # Copy official_document markdown files into the site
          # These are fetched client-side by doc.html
          mkdir -p _site/official_document
          cp official_document/*.md _site/official_document/

          # Create a .nojekyll file to prevent Jekyll processing
          touch _site/.nojekyll

          echo "✅ Site built successfully"
          echo "📁 Files in _site:"
          find _site -type f | head -50

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
