# ConfigMap for GraphQL API configuration and resource tuning
# Requirements: 18.4, 18.6
apiVersion: v1
kind: ConfigMap
metadata:
  name: graphql-api-config
  labels:
    app: graphql-api
data:
  # Resource defaults (referenced by Deployment)
  cpu-request: "100m"
  memory-request: "128Mi"
  cpu-limit: "500m"
  memory-limit: "512Mi"

  config.yaml: |
    server:
      port: 8080
      mode: production
      max_request_body_size: 1MB
      request_timeout: 30s
      max_batch_queries: 10
      allow_get_queries: false

    graphql:
      introspection_enabled: false
      max_query_complexity: 100
      max_query_depth: 10
      max_result_rows: 10000

    datasources:
      - name: analytics_db
        type: starrocks
        enabled: true
        connection:
          host: starrocks-fe
          port: 9030
          username: root
          password: "${GRAPHQL_STARROCKS_PASSWORD}"
          database: analytics
        options:
          pool_size: 20
          connection_timeout: 5s
          query_timeout: 30s
          allowed_tables:
            orders:
              columns: [order_id, user_id, amount, status, created_at]
            users:
              columns: [user_id, username, email, created_at]

      - name: monitoring
        type: prometheus
        enabled: true
        connection:
          url: http://prometheus:9090
        options:
          query_timeout: 15s
          max_data_points: 11000

    auth:
      method: jwt
      jwt:
        algorithm: RS256
        public_key_file: /etc/secrets/jwt-public.pem
        issuer: my-auth-service

    rate_limit:
      mode: local
      requests_per_window: 100
      window_size: 60s

    cache:
      enabled: true
      backend: memory
      default_ttl: 60s
      memory:
        max_entries: 10000
        max_memory_size: 256MB

    logging:
      level: info
      format: json

    tracing:
      enabled: true
      sampling_rate: 0.1
      otlp:
        endpoint: tempo:4317
        protocol: grpc

    compression:
      enabled: true
      min_size: 1KB

    shutdown:
      max_wait_time: 30s

    # SQL Template Engine (disabled by default)
    # Enable to support complex SQL queries via pre-defined Go text/template files
    sql_templates:
      enabled: false
      datasource_name: analytics_db
      base_dir: ./templates
      render_timeout: 5s
      max_rendered_sql_length: 65536
      max_concurrent_queries: 10
